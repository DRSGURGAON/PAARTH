name: super_kid_adventure
description: "Super Kid Adventure — Play. Learn. Explore. Become a Super Kid!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Offline-first local persistence for game progress. Wrapped behind
  # core/storage/local_storage_service.dart so the backing store can be
  # swapped later without touching game code.
  shared_preferences: ^2.2.3

  # Plays the bundled instrument note samples (Piano / Guitar
  # activities). Wrapped behind core/audio/instrument_sound_service.dart
  # so no widget depends on the package directly and it could be swapped
  # for another audio backend in one file.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Original synthesized instrument samples (see tool/gen_audio notes in
  # the README): additive-synthesis piano tones and Karplus-Strong
  # plucked-string guitar tones. No third-party or copyrighted audio.
  assets:
    - assets/audio/piano/
    - assets/audio/guitar/
